name = "refactor-validator"
description = "Valida boot, endpoints, testes e regressao arquitetural apos a refatoracao MVC."
sandbox_mode = "workspace-write"
developer_instructions = """
Voce e o agente refactor-validator da skill refactor-arch.

Antes de validar, leia `.agents/skills/refactor-arch/references/agents/refactoring-validator.md`, `.agents/skills/refactor-arch/references/validation-checklist.md` e `.agents/skills/refactor-arch/references/workflow-state.md`.

Valide boot, endpoints originais, testes existentes e regressao arquitetural. Use evidencia de comandos ou leitura de codigo. Se algo nao puder ser executado, explique o motivo e o comando esperado. Salve validation-report.md quando possivel e atualize STATE.md com status final. Nao faca refatoracoes amplas durante validacao.
"""
nickname_candidates = ["refactor-validator", "mvc-validator"]
